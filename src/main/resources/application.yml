server:
  shutdown: graceful

spring:
  application:
    name: template-prod
  profiles:
    active: dev
  slack:
    token: test #xoxb-7973206210161-9255580166432-oFjXhbg6xWG1geZkrYx4OOBt
  ai:
    google:
      genai:
        chat:
          options:
            #            model: gemini-2.5-pro #gemini-2.5-flash # 2.x 버전에 맞춰 최신 모델 사용 권장 (또는 gemini-1.5-pro)
            #            model: gemini-2.5-flash #gemini-2.5-flash # 2.x 버전에 맞춰 최신 모델 사용 권장 (또는 gemini-1.5-pro)
            #            model: gemini-2.5-flash-lite #gemini-2.5-flash # 2.x 버전에 맞춰 최신 모델 사용 권장 (또는 gemini-1.5-pro)
#            model: gemini-3-flash-lite-preview #gemini-2.5-flash # 2.x 버전에 맞춰 최신 모델 사용 권장 (또는 gemini-1.5-pro)
#            model: gemini-3.1-pro-preview #gemini-2.5-flash # 2.x 버전에 맞춰 최신 모델 사용 권장 (또는 gemini-1.5-pro)
#            model: gemini-3-flash-preview #gemini-2.5-flash # 2.x 버전에 맞춰 최신 모델 사용 권장 (또는 gemini-1.5-pro)
            model: gemini-3.1-flash-lite-preview
        embedding:
          text:
            options:
              model: gemini-embedding-2-preview
          #              model: models/text-embedding-004
          project-id: "unused-project" # dummy
          location: "us-central1" # 기본값으로 넣어둡니다.
          api-key: ${GEMINI_API_KEY}
        project-id: "unused-project" # dummy
        location: "us-central1" # 기본값으로 넣어둡니다.
        api-key: ${GEMINI_API_KEY}
    retry:
      max-attempts: 10
      on-http-codes: 429,503
      exclude-on-http-codes: 401,403
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 30s
    chat:
      observations:
        include-error-logging: true
        log-completion: true
        log-prompt: true
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      pgvector:
        observations:
          include-query-response: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    mcp:
      client:
        enabled: true
        name: my-mcp-client
        version: 1.0.0
        streamable-http:
          connections:
            crawling:
              url: http://localhost:8000
              endpoint: /mcp
        request-timeout: 300s
        type: async
  data:
    redis:
      host: localhost
      port: 6379
      username: default
      password: redispass
      client-type: lettuce
  reactor:
    context-propagation: auto
  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  logging:
    export:
      enabled: true
  httpexchanges:
    recording:
      enabled: true
auth:
  mode: jwt # jwt, basic, form

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
  api-docs:
    path: /v3/api-docs
    enabled: false

jobrunr:
  background-job-server:
    enabled: true
  dashboard:
    enabled: true # http://localhost:8002 에서 대시보드 확인 가능
    port: 8002
  database:
    table-prefix: jobrunr_
