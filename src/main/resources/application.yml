spring:
  application:
    name: template-prod
  profiles:
    active: dev
  slack:
    token: test #xoxb-7973206210161-9255580166432-oFjXhbg6xWG1geZkrYx4OOBt
  ai:
    google:
      genai:
        chat:
          options:
            model: gemini-2.5-flash-lite #gemini-2.5-flash # 2.x 버전에 맞춰 최신 모델 사용 권장 (또는 gemini-1.5-pro)
        api-key: ${GEMINI_API_KEY}
    retry:
      max-attempts: 10
      on-http-codes: 429,503
      exclude-on-http-codes: 401,403
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 30s
    chat:
      memory:
        redis:
          key-prefix: "groupware_chat:" # Redis 키 이름 앞에 붙을 접두사
          time-to-live: "7d" # 7일 지나면 대화 기록이 DB에서 알아서 증발합니다!
  data:
    redis:
      host: localhost
      port: 6379
      username: default
      password: redispass
      database: 0
  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
#          jdbc:
#            initialize-schema: always
auth:
  mode: jwt # jwt, basic, form
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
