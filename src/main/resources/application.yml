        embedding:
          text:
            options:
              model: gemini-embedding-2-preview
          #              model: models/text-embedding-004
          project-id: "unused-project" # dummy
          location: "us-central1" # 기본값으로 넣어둡니다.
          api-key: ${GEMINI_API_KEY}
        project-id: "unused-project" # dummy
        location: "us-central1" # 기본값으로 넣어둡니다.
        api-key: ${GEMINI_API_KEY}
    retry:
      max-attempts: 10
      on-http-codes: 429,503
      exclude-on-http-codes: 401,403
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 30s
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    mcp:
      client:
        enabled: true
        name: my-mcp-client
        version: 1.0.0
        streamable-http:
          connections:
            crawling:
              url: http://localhost:8000
              endpoint: /mcp
        request-timeout: 45s
        type: async
  data:
    redis:
      host: localhost
      port: 6379
      username: default
      password: redispass
      client-type: lettuce
  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
#          jdbc:
#            initialize-schema: always
auth:
  mode: jwt # jwt, basic, form

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
  api-docs:
    path: /v3/api-docs
    enabled: false

jobrunr:
  background-job-server:
    enabled: true
  dashboard:
    enabled: true # http://localhost:8002 에서 대시보드 확인 가능
    port: 8002
  database:
    table-prefix: jobrunr_
