  profiles:
    active: dev
  slack:
    token: test #xoxb-7973206210161-9255580166432-oFjXhbg6xWG1geZkrYx4OOBt
  ai:
    google:
      genai:
        chat:
          options:
            model: gemini-2.5-flash #gemini-2.5-flash # 2.x 버전에 맞춰 최신 모델 사용 권장 (또는 gemini-1.5-pro)
        embedding:
          text:
            options:
              model: gemini-embedding-2-preview
#              model: models/text-embedding-004
          project-id: "unused-project" # dummy
          location: "us-central1" # 기본값으로 넣어둡니다.
          api-key: ${GEMINI_API_KEY}
        project-id: "unused-project" # dummy
        location: "us-central1" # 기본값으로 넣어둡니다.
        api-key: ${GEMINI_API_KEY}
    retry:
      max-attempts: 10
      on-http-codes: 429,503
      exclude-on-http-codes: 401,403
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 30s
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    mcp:
      client:
        enabled: true
        name: my-mcp-client
        version: 1.0.0
        streamable-http:
          connections:
            crawling:
              url: http://localhost:8081
              endpoint: /mcp
        request-timeout: 20s
        type: async
  data:
    redis:
      host: localhost
      port: 6379
      username: default
      password: redispass
      client-type: lettuce
  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
#          jdbc:
#            initialize-schema: always
auth:
  mode: jwt # jwt, basic, form
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
