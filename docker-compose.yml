version: "3.8"

services:
  attendance-app:
    image: "${IMAGE_NAME}:${IMAGE_TAG}"
    container_name: attendance_back
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/attendance
      TZ: Asia/Seoul
    networks:
      - attendance
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  attendance:
    external: true