services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: groupware-postgres
    restart: always
    environment:
      POSTGRES_DB: groupware
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ai-challenge
  redis:
    image: redis:7-alpine
    container_name: groupware-redis
    restart: always
    command: redis-server --requirepass redispass
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ai-challenge
  chrome:
    image: browserless/chrome:latest
    container_name: groupware-chrome
    restart: always
    shm_size: '2gb'  # Chrome의 메모리 부족으로 인한 Crash 방지 (매우 중요)
    environment:
      - TOKEN=01QWI6OUT42U8
      - TZ=Asia/Seoul
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=300000  # 타임아웃 5분으로 연장
      - PREBOOT_CHROME=true        # 브라우저 미리 띄우기
      - KEEP_ALIVE=true            # 연결 유지 활성화
    ports:
      - "3001:3000"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: "20m"   # 로그 파일 1개당 최대 20MB
        max-file: "5"     # 최대 5개 파일까지만 보관
    networks:
      - ai-challenge
  nginx:
    image: nginx:stable-alpine
    container_name: groupware-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    # 만약 프론트엔드가 호스트 머신(로컬)에서 실행 중이라면 아래 설정이 필요합니다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-challenge
    depends_on:
      - postgres # 필요에 따라 의존성 추가
        #  playwright-mcp:
        #    image: mcp/playwright:latest
        #    container_name: playwright-mcp
        #    command: >
        #      --transport http
        #      --port 3000
        #    ports:
        #      - "3000:3000"
      #    restart: unless-stopped
      #    networks:
      #      - ai-challenge
      #    # ?대?留?李⑤떒???먰븯硫??꾨옒泥섎읆 ?ㅽ듃?뚰겕 ?뺤콉 異붽? 怨좊젮
    # cap_drop:
    #   - ALL
  alloy:
    image: grafana/alloy:latest
    container_name: groupware-alloy
    restart: always
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
    command: [ "run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy" ]
    ports:
      - "12345:12345" # Alloy UI (디버깅용)
      - "4317:4317"  # OTLP gRPC (호스트 포트 변경: 4317 충돌 회피)
      - "4318:4318"  # OTLP HTTP (호스트 포트 변경: 4318 충돌 회피)
    networks:
      - ai-challenge

  # 모니터링 백엔드
  prometheus:
    image: prom/prometheus:latest
    container_name: groupware-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--enable-feature=exemplar-storage"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    networks:
      - ai-challenge

  loki:
    image: grafana/loki:latest
    container_name: groupware-loki
    ports:
      - "3100:3100"
    networks:
      - ai-challenge

  tempo:
    image: grafana/tempo:latest
    container_name: groupware-tempo
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml
    ports:
      - "3200:3200"
    networks:
      - ai-challenge

  grafana:
    image: grafana/grafana:latest
    container_name: groupware-grafana
    ports:
      - "3000:3000"
    networks:
      - ai-challenge
